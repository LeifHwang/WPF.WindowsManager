name: BuildAndPack
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

env:
  PKG_DIR: nupkgs

jobs:
  build-and-publish:
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2.0.1

      - name: pack
        env:
          PRJ: "./WPF.WindowsManager/WPF.WindowsManager.csproj"
        run: |
          dotnet build $PRJ --configuration Release
          nuget pack $PRJ -Properties Configuration=Release -OutputDirectory $PKG_DIR

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: LeifHwang

      - name: push to NuGet
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Get-ChildItem $PKG_DIR -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json
          }
